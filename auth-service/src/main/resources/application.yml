server:
  port: 8082

spring:
  application:
    name: auth-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

internal:
  api-key: ${INTERNAL_API_KEY}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
