server:
  port: 8082

spring:
  application:
    name: auth-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: digital-money-house-auth-service-jwt-secret-key
  expiration-ms: 86400000

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
