# /users/register, /auth/login y /user/logout son públicos.
# /internal/** no se enruta. El resto de /accounts y /users exige un JWT vigente.
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: users-service
              uri: lb://users-service
              predicates:
                - Path=/users/**
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: auth-logout
              uri: lb://auth-service
              predicates:
                - Path=/user/logout
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/accounts/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: ${JWT_SECRET}
