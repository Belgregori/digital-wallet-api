# Sprint 1: /users/register, /auth/login y /user/logout son públicos.
# /internal/** no se enruta. La validación centralizada del JWT en este gateway
# queda para los endpoints protegidos de los próximos sprints (docs/arquitectura.md).
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: users-service
              uri: lb://users-service
              predicates:
                - Path=/users/**
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: auth-logout
              uri: lb://auth-service
              predicates:
                - Path=/user/logout

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
